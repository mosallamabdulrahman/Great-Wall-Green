<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 48" fill="none">
  <!-- ISO 9001 Quality Management Mark -->
  <g transform="translate(35, 2)">
    <rect x="0" y="2" width="70" height="40" rx="4" fill="#ffffff"/>
    <!-- Globe motif -->
    <circle cx="18" cy="22" r="14" stroke="#0f4c81" stroke-width="1.8" fill="#f0f6fa"/>
    <ellipse cx="18" cy="22" rx="6" ry="14" stroke="#0f4c81" stroke-width="1"/>
    <line x1="4" y1="22" x2="32" y2="22" stroke="#0f4c81" stroke-width="1"/>
    <line x1="7" y1="15" x2="29" y2="15" stroke="#0f4c81" stroke-width="0.8"/>
    <line x1="7" y1="29" x2="29" y2="29" stroke="#0f4c81" stroke-width="0.8"/>
    <!-- ISO text -->
    <text x="50" y="21" font-family="'Noto Sans', 'Arial Black', sans-serif" font-weight="900" font-size="14" fill="#0f4c81" text-anchor="middle">ISO</text>
    <text x="50" y="32" font-family="'Noto Sans', sans-serif" font-weight="800" font-size="9" fill="#0f4c81" text-anchor="middle">9001</text>
  </g>
</svg>
